# Let clones be customised at first boot:
#  - VMware : guestinfo.userdata / guestinfo.metadata keys in the .vmx
#  - NoCloud: a "cidata" ISO/USB or seed files in /var/lib/cloud/seed/nocloud
#  - None   : fall back to the config baked in at install time
datasource_list: [ VMware, NoCloud, None ]

# Root is on LVM. Disk growth is handled by grow-root.service
# (growpart -> pvresize -> lvextend -r), so cloud-init's resizer stays off.
growpart:
  mode: "off"
resize_rootfs: false
